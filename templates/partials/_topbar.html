<header class="navbar bg-white border-b border-slate-200 px-4 lg:px-6 sticky top-0 z-30">
    <div class="flex-none lg:hidden">
        <label for="main-drawer" class="btn btn-square btn-ghost">
            <span class="material-icons">menu</span>
        </label>
    </div>

    <div class="flex-1">
        <div>
            <h1 class="text-lg font-bold text-slate-800">SiPANDU VIRTUAL</h1>
            <p class="text-sm text-slate-500">Sistem Pendampingan Terpadu Virtual</p>
        </div>
    </div>

    <div class="flex items-center gap-2">
        <a href="{% url 'dashboard:notification_list' %}" class="btn btn-ghost btn-circle">
            <div class="indicator">
                <span class="material-icons">notifications</span>
                {% if unread_notification_count %}
                <span class="badge badge-error badge-sm indicator-item">{{ unread_notification_count }}</span>
                {% endif %}
            </div>
        </a>

        <div class="dropdown dropdown-end">
            <label tabindex="0" class="btn btn-ghost gap-2">
                <span class="material-icons">account_circle</span>
                <span class="hidden md:inline">
                    {% if request.user.is_authenticated %}
                        {{ request.user.get_full_name|default:request.user.username }}
                    {% else %}
                        Guest
                    {% endif %}
                </span>
            </label>

            <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-56 text-slate-700">
                <li>
                    <a href="#">
                        <span class="material-icons text-sm">person</span>
                        Profil
                    </a>
                </li>
                <li>
                    <a href="#">
                        <span class="material-icons text-sm">lock</span>
                        Ubah Password
                    </a>
                </li>

                {% if request.user.is_authenticated %}
                <li>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="w-full text-left flex items-center gap-2 px-4 py-2 hover:bg-slate-100 rounded-lg">
                            <span class="material-icons text-sm">logout</span>
                            Keluar
                        </button>
                    </form>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</header>
