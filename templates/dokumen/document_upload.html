{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-4">
    <div><h2 class="page-title">Upload Dokumen</h2></div>
    <div class="card bg-white border shadow-sm">
        <div class="card-body space-y-4">
            <div class="form-control">
                <label class="label"><span class="label-text">Judul Dokumen</span></label>
                <input type="text" class="input input-bordered">
            </div>
            <div class="form-control">
                <label class="label"><span class="label-text">Triwulan</span></label>
                <select class="select select-bordered">
                    <option>TW1</option><option>TW2</option><option>TW3</option><option>TW4</option>
                </select>
            </div>
            <div class="form-control">
                <label class="label"><span class="label-text">File</span></label>
                <input type="file" class="file-input file-input-bordered">
            </div>
            <div class="flex justify-end">
                <button class="btn btn-primary">Upload</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
